name: Swift CI

# Nothing here compiles. The build, the tests and the platform builds are the full gate,
# which runs in release.yml, by hand and at a release. docs/Conformance.md describes the split.

on:
  pull_request:
  merge_group:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Structural lint
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Structural lint
        run: sh scripts/structure-lint.sh

  changelog:
    name: Changelog updated
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Require a CHANGELOG.md change
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          changed="$(git diff --name-only "$PR_BASE" HEAD)"
          if grep -qx 'CHANGELOG.md' <<<"$changed"; then
            echo "CHANGELOG.md updated."
          else
            echo "::error::Add an entry to CHANGELOG.md"
            exit 1
          fi

  ci-ok:
    name: CI OK
    if: always()
    needs: [lint, changelog]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Check job results
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for r in $RESULTS; do
            case "$r" in
              success|skipped) ;;
              *) echo "::error::A required job ended with: $r"; exit 1 ;;
            esac
          done
          echo "All jobs passed or were intentionally skipped."
